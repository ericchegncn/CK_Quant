---
services:
  ck-quant:
    image: ${CK_QUANT_IMAGE:-ericchenghz/ck-quant:stable}
    container_name: ${CK_QUANT_CONTAINER_NAME:-CK_Quant}
    restart: unless-stopped
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "${CK_QUANT_WEBUI_BIND:-127.0.0.1}:${CK_QUANT_WEBUI_PORT:-8080}:8080"
    command: >
      trade
      --userdir /freqtrade/user_data
      --logfile /freqtrade/user_data/logs/${CK_QUANT_LOGFILE:-ck-quant.log}
      --db-url sqlite:////freqtrade/user_data/${CK_QUANT_DATABASE:-tradesv3.sqlite}
      --config /freqtrade/user_data/${CK_QUANT_CONFIG:-config.json}
      --strategy ${CK_QUANT_STRATEGY:-SampleStrategy}
