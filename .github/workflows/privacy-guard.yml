name: Privacy Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  strategy-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Reject private strategy and live-operation files
        shell: bash
        run: |
          forbidden_paths="$(git ls-files \
            'user_data/strategies/**' \
            'scripts/ssh_*.py' \
            'scripts/*_stat*.py' \
            'scripts/wick_*.py' \
            'tests/strategy/test_ck_*.py')"
          if [[ -n "$forbidden_paths" ]]; then
            echo 'Private strategy or live-operation files are tracked:' >&2
            echo "$forbidden_paths" >&2
            exit 1
          fi

          if git grep -nE \
            'from user_data\.strategies\.CK_|import user_data\.strategies\.CK_|class CK_(Trend|EMA|Momentum|Reversion|Wick|Structure|RS|Retest)' \
            -- '*.py'; then
            echo 'Private CK strategy code or imports detected.' >&2
            exit 1
          fi
