name: Release CK Quant 2026.9

# 本次发布只做"同步上游 freqtrade 2026.9"两件事：
#   1) 构建并推送隐私安全的 Docker 镜像（含 stable / latest）
#   2) 建 GitHub Release，发布说明取 docs/releases/2026.9.md
# 不含 Android APK（本次同步未改动移动端，APK 走 ck-quant-docker-publish.yml / 既有 release 工作流）。

on:
  push:
    branches:
      - main

concurrency:
  group: ck-quant-release-2026.9
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE_NAME: ericchenghz/ck-quant
  RELEASE_TAG: 2026.9

jobs:
  release:
    if: github.repository == 'ericchegncn/CK_Quant' && contains(github.event.head_commit.message, '[release-2026.9]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "CK Quant $RELEASE_TAG" \
              --notes-file docs/releases/2026.9.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "CK Quant $RELEASE_TAG" \
              --notes-file docs/releases/2026.9.md
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
