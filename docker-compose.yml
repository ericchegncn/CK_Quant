---
# CK_Quant 本机 compose 文件（同时充当公开仓库里的默认可下载模板）。
#
# ⚠️ 运行方式由本目录下的 .env 决定，而不是由本文件决定：
#    .env 里的 CK_QUANT_STRATEGY / CK_QUANT_DATABASE / CK_QUANT_LOGFILE 就是本机实际
#    使用的策略类名、数据库文件名和日志文件名。改 .env = 改运行方式：这三个值必须与
#    本机 user_data 里真实存在的策略、数据库完全一致，否则容器会去载入不存在的策略
#    或数据库 → 启动即退出 → 重启循环。
#    事故教训（2026-09-20）：一个陈旧的 .env 曾静默覆盖 --strategy 与 --db-url，造成
#    了上面这种重启循环。因此每改一次 .env，都要用
#    `docker compose -p ck_quant -f docker-compose.yml config` 复核渲染出来的真实命令。
#    .env 已被 .gitignore 与 .dockerignore 同时排除：只存在于本机，不入库、不进镜像。
#    没有任何 .env 时，下面的默认值只是上游示例占位符（SampleStrategy / freqtrade.log /
#    tradesv3.sqlite），不代表一份可用的本机配置。
#    公共模板见 docker-compose.ck-quant.example.yml，变量清单见 .env.example。
services:
  CK_Quant:
    image: ericchenghz/ck-quant:latest
    container_name: CK_Quant
    restart: unless-stopped
    working_dir: /CK_Quant
    volumes:
      - "./user_data:/CK_Quant/user_data"
    ports:
      - "0.0.0.0:8081:8080"
    environment:
      # 交易所侧止损单状态查询分批：每 2 轮查一遍「已成功挂出」的持仓（缺单的仍每轮必查）。
      # 止损由交易所执行，分批只延后状态同步，不影响止损触发；实测该阶段 3.9s → ~2.0s。
      CKQ_STOPLOSS_CHECK_BATCH: "1"   # 2026-10-07: 2→1，每轮全量检查止损状态（上游行为，不引入额外延迟）
    # 2026-10-11: 追加第二个 --config 打开对外展示页（api_server.public_showcase）。
    # 该文件位于 user_data/ 内（已 gitignore），既不入库也不会被打进镜像；
    # 去掉这一行即可对游客完全关闭展示页。
    command: >
      trade
      --userdir /CK_Quant/user_data
      --logfile /CK_Quant/user_data/logs/${CK_QUANT_LOGFILE:-freqtrade.log}
      --db-url sqlite:////CK_Quant/user_data/${CK_QUANT_DATABASE:-tradesv3.sqlite}
      --config /CK_Quant/user_data/config_binance.json
      --config /CK_Quant/user_data/config_public_showcase.json
      --strategy ${CK_QUANT_STRATEGY:-SampleStrategy}
