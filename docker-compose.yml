---
services:
  ck-quant:
    image: ${CK_QUANT_IMAGE:-ericchenghz/ck-quant:latest}
    container_name: ${CK_QUANT_CONTAINER_NAME:-CK_Quant}
    restart: unless-stopped
    volumes:
      - "./user_data:/CK_Quant/user_data"
    ports:
      - "${CK_QUANT_WEBUI_BIND:-0.0.0.0}:${CK_QUANT_WEBUI_PORT:-8080}:8080"
    command: >
      trade
      --userdir /CK_Quant/user_data
      --logfile /CK_Quant/user_data/logs/${CK_QUANT_LOGFILE:-ck-quant.log}
      --db-url sqlite:////CK_Quant/user_data/${CK_QUANT_DATABASE:-tradesv3.sqlite}
      --config /CK_Quant/user_data/${CK_QUANT_CONFIG:-config_5m.json}
      --strategy ${CK_QUANT_STRATEGY:-CK_Trend_5m}
